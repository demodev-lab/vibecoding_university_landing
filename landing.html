<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>바이브 코딩 과외 — 랜딩 탐색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#f0eee9;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}
  *{box-sizing:border-box}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="variants/v1-tokens.jsx"></script>
<script type="text/babel" src="variants/v1-nav.jsx"></script>
<script type="text/babel" src="variants/v1-hero.jsx"></script>
<script type="text/babel" src="variants/v1-trial.jsx"></script>
<script type="text/babel" src="variants/v1-timer.jsx"></script>
<script type="text/babel" src="variants/v1-curriculum.jsx"></script>
<script type="text/babel" src="variants/v1-camp.jsx"></script>
<script type="text/babel" src="variants/v1-footer.jsx"></script>
<script type="text/babel" src="variants/v1-classic.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
  const W = 1280;
  const H = 6000;
  function App(){
    return (
      <DesignCanvas>
        <DCSection id="landing" title="바이브 코딩 과외 · 랜딩 페이지" subtitle="프리미엄 다크 · 최소 카피">
          <DCArtboard id="v1" label="대모산 스타일 · 화이트+인디고 (바이브코딩대학 산업)" width={W} height={H}>
            <V1Classic />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  const waitFor = () => {
    if (window.V1Classic && window.V1Nav && window.V1Hero && window.V1Trial && window.V1Timer && window.V1Curriculum && window.V1Camp && window.V1Footer && window.v1c) {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } else {
      setTimeout(waitFor, 50);
    }
  };
  waitFor();
</script>
</body>
</html>
